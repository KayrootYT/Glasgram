name: Build Glasgram APK

on:
  push:
    branches: [main]
    paths:
      - 'Glasgram.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q Glasgram.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Telegram API credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TELEGRAM_API_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::TELEGRAM_API_ID must be a positive numeric Telegram API ID."
            exit 1
          fi
          if [[ ! "$TELEGRAM_API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::TELEGRAM_API_HASH must be the 32-character hexadecimal API hash from my.telegram.org."
            exit 1
          fi
          echo "Telegram API credentials are present and correctly formatted."

      - name: Build Debug APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glasgram-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk