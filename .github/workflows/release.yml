name: Glasgram Signed APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version, for example 1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      GLASGRAM_STORE_PASSWORD: ${{ secrets.GLASGRAM_STORE_PASSWORD }}
      GLASGRAM_KEY_ALIAS: ${{ secrets.GLASGRAM_KEY_ALIAS }}
      GLASGRAM_KEY_PASSWORD: ${{ secrets.GLASGRAM_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.GLASGRAM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing GLASGRAM_KEYSTORE_BASE64"; exit 1; }
          test -n "$GLASGRAM_STORE_PASSWORD" || { echo "::error::Missing GLASGRAM_STORE_PASSWORD"; exit 1; }
          test -n "$GLASGRAM_KEY_ALIAS" || { echo "::error::Missing GLASGRAM_KEY_ALIAS"; exit 1; }
          test -n "$GLASGRAM_KEY_PASSWORD" || { echo "::error::Missing GLASGRAM_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/glasgram-signing"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/glasgram-signing/glasgram-release.jks"
          test -s "$RUNNER_TEMP/glasgram-signing/glasgram-release.jks"
          echo "GLASGRAM_STORE_FILE=$RUNNER_TEMP/glasgram-signing/glasgram-release.jks" >> "$GITHUB_ENV"

      - name: Set release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
          else
            echo "::error::Use a v* tag or provide version_name."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version name: $VERSION"
            exit 1
          fi
          # Reserved high range ensures releases upgrade the early 1..N development builds.
          VERSION_CODE=$((100000 + RUN_NUMBER))
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "GLASGRAM_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "GLASGRAM_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Run tests and build signed release APK
        run: |
          gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify APK package identity and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.glasgram.app'"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version_name) }}
          name: Glasgram ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
