name: Telegram Upstream Watch

on:
  schedule:
    - cron: "23 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: telegram-upstream-watch
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Glasgram
        uses: actions/checkout@v4

      - name: Check official upstream repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/upstream_watch.py \
            --config config/upstream-lock.json \
            --output upstream-report.md \
            --json-output upstream-report.json

      - name: Upload upstream report
        uses: actions/upload-artifact@v4
        with:
          name: glasgram-upstream-report
          path: |
            upstream-report.md
            upstream-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Create or update upstream review issue
        if: always() && hashFiles('upstream-report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Telegram upstream review — automated report';
            const body = fs.readFileSync('upstream-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = open.data.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Created issue #${created.data.number}`);
            }
